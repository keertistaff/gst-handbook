<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="background:#ffffff; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <text x="450" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">GST Registration Ka 5-Step Process (Online Portal)</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#64748b">Form GST REG-01 se lekar 15-Digit GSTIN Certificate (REG-06) pane tak ka roadmap</text>

  <!-- Steps in horizontal cards -->
  <g transform="translate(30, 110)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="150" height="230" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="75" cy="40" r="22" fill="#2563eb"/>
    <text x="75" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
    <text x="75" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PART A Fill Karein</text>
    <text x="12" y="115" font-size="11.5" fill="#334155">• PAN Card details</text>
    <text x="12" y="135" font-size="11.5" fill="#334155">• Mobile No &amp; Email</text>
    <text x="12" y="155" font-size="11.5" fill="#334155">• State select karein</text>
    <text x="12" y="175" font-size="11.5" fill="#334155">• OTP verify karein</text>
    <rect x="10" y="195" width="130" height="25" rx="4" fill="#dbeafe"/>
    <text x="75" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">TRN Generate Hua</text>

    <!-- Arrow 1 -->
    <text x="160" y="125" font-size="22" fill="#94a3b8">→</text>

    <!-- Step 2 -->
    <rect x="180" y="0" width="150" height="230" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="255" cy="40" r="22" fill="#16a34a"/>
    <text x="255" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
    <text x="255" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">PART B Complete</text>
    <text x="192" y="115" font-size="11.5" fill="#334155">• Business Details</text>
    <text x="192" y="135" font-size="11.5" fill="#334155">• Promoters / Partners</text>
    <text x="192" y="155" font-size="11.5" fill="#334155">• Principal Place of Biz</text>
    <text x="192" y="175" font-size="11.5" fill="#334155">• Top 5 HSN / SAC</text>
    <rect x="190" y="195" width="130" height="25" rx="4" fill="#dcfce7"/>
    <text x="255" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">15 Din ka Time (TRN)</text>

    <!-- Arrow 2 -->
    <text x="340" y="125" font-size="22" fill="#94a3b8">→</text>

    <!-- Step 3 -->
    <rect x="360" y="0" width="150" height="230" rx="8" fill="#fefce8" stroke="#fef08a"/>
    <circle cx="435" cy="40" r="22" fill="#ca8a04"/>
    <text x="435" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
    <text x="435" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Aadhaar Auth</text>
    <text x="372" y="115" font-size="11.5" fill="#334155">• Aadhaar OTP Auth</text>
    <text x="372" y="135" font-size="11.5" fill="#334155">• Agar No kiya toh</text>
    <text x="372" y="155" font-size="11.5" fill="#334155">  Physical site visit</text>
    <text x="372" y="175" font-size="11.5" fill="#334155">• DSC / E-Sign submit</text>
    <rect x="370" y="195" width="130" height="25" rx="4" fill="#fef9c3"/>
    <text x="435" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">ARN Issue Hoga</text>

    <!-- Arrow 3 -->
    <text x="520" y="125" font-size="22" fill="#94a3b8">→</text>

    <!-- Step 4 -->
    <rect x="540" y="0" width="150" height="230" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <circle cx="615" cy="40" r="22" fill="#9333ea"/>
    <text x="615" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
    <text x="615" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Officer Review</text>
    <text x="552" y="115" font-size="11.5" fill="#334155">• 7 working days</text>
    <text x="552" y="135" font-size="11.5" fill="#334155">• Sab sahi raha toh OK</text>
    <text x="552" y="155" font-size="11.5" fill="#334155">• Query aayi toh REG-03</text>
    <text x="552" y="175" font-size="11.5" fill="#334155">• 7 days me REG-04 reply</text>
    <rect x="550" y="195" width="130" height="25" rx="4" fill="#f3e8ff"/>
    <text x="615" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">Verification Phase</text>

    <!-- Arrow 4 -->
    <text x="700" y="125" font-size="22" fill="#94a3b8">→</text>

    <!-- Step 5 -->
    <rect x="720" y="0" width="150" height="230" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <circle cx="795" cy="40" r="22" fill="#059669"/>
    <text x="795" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
    <text x="795" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">GSTIN Allotment</text>
    <text x="732" y="115" font-size="11.5" fill="#334155">• Form GST REG-06</text>
    <text x="732" y="135" font-size="11.5" fill="#334155">• 15-Digit GSTIN mila</text>
    <text x="732" y="155" font-size="11.5" fill="#334155">• Login ID &amp; Password</text>
    <text x="732" y="175" font-size="11.5" fill="#334155">• Display at Biz place</text>
    <rect x="730" y="195" width="130" height="25" rx="4" fill="#a7f3d0"/>
    <text x="795" y="212" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">Registration DONE!</text>
  </g>

  <!-- Footer Tip -->
  <rect x="30" y="360" width="840" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="383" text-anchor="middle" font-size="12.5" fill="#475569">💡 Pro Tip: Agar officer 7 working days me koi action nahi leta, to Application "Deemed Approved" ho jati hai!</text>
</svg>