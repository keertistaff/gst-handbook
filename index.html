<!DOCTYPE html>
<html lang="hi-EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>GST Complete Learning Handbook (Simple Hinglish) | G-TEC Nergy Vidya</title>
  <meta name="description" content="GST complete course handbook in simple Hinglish with concept visual diagrams and practical return filing guide for Modules 1 to 4." />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
  
  <!-- FontAwesome 6 Free CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-light">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-toggle-btn" id="mobileMenuBtn" aria-label="Menu" title="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="brand">
        <span class="brand-badge"><i class="fa-solid fa-scale-balanced"></i> GST</span>
        <div class="brand-info">
          <h1>GST Handbook</h1>
          <span class="lang-tag">Hinglish</span>
        </div>
      </div>
    </div>

    <!-- Desktop Search -->
    <div class="header-search" id="desktopSearchBar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="globalSearchInput" placeholder="Khojein: GSTR-1, ITC, E-Way Bill, Registration..." aria-label="Search Handbook" />
      <kbd class="search-kbd">/</kbd>
      <div id="searchResultsDropdown" class="search-dropdown hidden"></div>
    </div>

    <!-- Header Actions -->
    <div class="header-right">
      <button id="mobileSearchBtn" class="action-btn mobile-search-btn" title="Search" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button id="themeToggleBtn" class="action-btn theme-btn" title="Theme" aria-label="Toggle Theme">
        <i class="fa-solid fa-sun theme-icon-light"></i>
        <i class="fa-solid fa-moon theme-icon-dark"></i>
      </button>
      <a href="https://github.com/keertistaff/gst-handbook" target="_blank" rel="noopener noreferrer" class="action-btn github-btn desktop-only" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </header>

  <!-- Mobile Search Bar Overlay -->
  <div id="mobileSearchOverlay" class="mobile-search-overlay hidden">
    <div class="mobile-search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="mobileSearchInput" placeholder="Topic ya form search karein..." autocomplete="off" />
      <button id="closeMobileSearchBtn" class="close-search-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="mobileSearchResults" class="mobile-search-results"></div>
  </div>

  <!-- Mobile Drawer Backdrop -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Main Application Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation Drawer -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span class="sidebar-title"><i class="fa-solid fa-book-open"></i> VISHAY SUCHEE</span>
        <button id="sidebarCloseBtn" class="sidebar-close-btn mobile-only"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="module-filter-bar">
        <button class="filter-pill active" data-filter="all"><i class="fa-solid fa-layer-group"></i> All</button>
        <button class="filter-pill" data-filter="1">Mod 1</button>
        <button class="filter-pill" data-filter="2">Mod 2</button>
        <button class="filter-pill" data-filter="3">Mod 3</button>
        <button class="filter-pill" data-filter="4">Mod 4</button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Populated dynamically by app.js -->
      </nav>

      <div class="sidebar-footer">
        <a href="https://github.com/keertistaff/gst-handbook" target="_blank" rel="noopener noreferrer" class="sidebar-gh-link">
          <i class="fa-brands fa-github"></i> View GitHub Repo
        </a>
      </div>
    </aside>

    <!-- Main Content Reader -->
    <main class="app-main" id="appMain">
      <div class="content-container" id="contentContainer">
        <!-- Mobile Quick Chapter Switcher -->
        <div class="mobile-chapter-bar">
          <div class="mobile-bar-label"><i class="fa-solid fa-book-bookmark"></i> Select Chapter:</div>
          <select id="mobileChapterSelect" class="mobile-chapter-select" aria-label="Chapter Badlein">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Breadcrumb -->
        <div class="content-breadcrumb" id="contentBreadcrumb">
          <i class="fa-solid fa-house"></i> <span>Module 1</span> &gt; <span>Chapter 1</span>
        </div>

        <article class="chapter-article" id="chapterArticle">
          <!-- Dynamic Chapter Content Injected Here -->
        </article>

        <!-- Chapter Navigation Footer -->
        <div class="chapter-nav-footer">
          <button id="prevChapterBtn" class="nav-chapter-btn prev">
            <span class="nav-dir"><i class="fa-solid fa-arrow-left"></i> Pichhla</span>
            <span class="nav-title" id="prevChapterTitle">None</span>
          </button>
          <button id="nextChapterBtn" class="nav-chapter-btn next">
            <span class="nav-dir">Agla <i class="fa-solid fa-arrow-right"></i></span>
            <span class="nav-title" id="nextChapterTitle">None</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Table of Contents Mini-Nav (Desktop Right Column Only) -->
    <aside class="app-toc" id="appToc">
      <div class="toc-header"><i class="fa-solid fa-list-ul"></i> IS CHAPTER MEIN</div>
      <ul class="toc-list" id="tocList">
        <!-- Dynamically populated from h2/h3 -->
      </ul>
    </aside>
  </div>

  <!-- Lightbox Modal for Visuals/Diagrams -->
  <div id="imageLightbox" class="lightbox-modal">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="Expanded diagram preview" />
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <!-- Load Data and Main Script -->
  <script src="course_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
