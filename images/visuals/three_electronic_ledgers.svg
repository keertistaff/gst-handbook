<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="background:#ffffff; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">GST Portal Ke 3 Electronic Ledgers (Khate)</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#64748b">Section 49 ke tehat online tax payment aur offset mechanism</text>

  <!-- 3 Boxes on top -->
  <g transform="translate(40, 100)">
    <!-- Ledger 1: Credit Ledger -->
    <rect x="0" y="0" width="250" height="180" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="38" rx="8" fill="#2563eb"/>
    <text x="125" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Electronic Credit Ledger</text>
    <text x="15" y="65" font-size="12" font-weight="700" fill="#1d4ed8">Form GST PMT-02</text>
    <text x="15" y="90" font-size="12" fill="#334155">• Inward supplies (purchases) par mila Input Tax Credit (ITC).</text>
    <text x="15" y="130" font-size="11.5" fill="#b91c1c">⚠️ Note: Isse sirf OUTPUT TAX pay ho sakta hai. Interest/Penalty nahi!</text>

    <!-- Ledger 2: Cash Ledger -->
    <rect x="280" y="0" width="250" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="280" y="0" width="250" height="38" rx="8" fill="#16a34a"/>
    <text x="405" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Electronic Cash Ledger</text>
    <text x="295" y="65" font-size="12" font-weight="700" fill="#15803d">Form GST PMT-05</text>
    <text x="295" y="90" font-size="12" fill="#334155">• Bank se Challan (PMT-06) generate karke deposit kiya gaya cash.</text>
    <text x="295" y="130" font-size="11.5" fill="#15803d">✔ Isse Tax, Interest, Penalty, Late Fee sab pay ho sakta hai.</text>

    <!-- Ledger 3: Liability Ledger -->
    <rect x="560" y="0" width="260" height="180" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="560" y="0" width="260" height="38" rx="8" fill="#dc2626"/>
    <text x="690" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Electronic Liability Ledger</text>
    <text x="575" y="65" font-size="12" font-weight="700" fill="#b91c1c">Form GST PMT-01</text>
    <text x="575" y="90" font-size="12" fill="#334155">• GSTR-1, GSTR-3B ya notices se generate hui total deendari (due).</text>
    <text x="575" y="130" font-size="11.5" fill="#991b1b">Kisko kitna dena hai (CGST/SGST/IGST breakdown).</text>
  </g>

  <!-- Offset Flow -->
  <g transform="translate(60, 315)">
    <rect width="780" height="95" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="390" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#1e293b">🔄 How Tax is Discharged in GSTR-3B (Offset Process)</text>
    <text x="390" y="60" text-anchor="middle" font-size="13" fill="#334155">Pehle <tspan font-weight="700" fill="#2563eb">[Credit Ledger / ITC]</tspan> se Liability Ledger ka tax minus hota hai.</text>
    <text x="390" y="80" text-anchor="middle" font-size="13" fill="#334155">Jo balance tax, interest ya penalty bach jati hai, wo <tspan font-weight="700" fill="#16a34a">[Cash Ledger]</tspan> se debit hokar zero hoti hai!</text>
  </g>
</svg>