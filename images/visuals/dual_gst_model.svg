<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <text x="450" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">India Ka Dual GST Model (Section 7 &amp; 8)</text>
  <text x="450" y="75" text-anchor="middle" font-size="14" fill="#64748b">Location of Supplier vs Place of Supply se tax decide hota hai</text>

  <!-- Root Supply Box -->
  <rect x="330" y="105" width="240" height="60" rx="8" fill="#1e293b"/>
  <text x="450" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">📦 GOODS / SERVICES SUPPLY</text>

  <!-- Branch lines -->
  <path d="M400 165 L240 220" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M500 165 L660 220" stroke="#7c3aed" stroke-width="3" fill="none"/>

  <!-- Left: Intra-State Supply -->
  <g transform="translate(60, 220)">
    <rect width="360" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="180" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1e40af">INTRA-STATE SUPPLY</text>
    <text x="180" y="55" text-anchor="middle" font-size="13" fill="#3b82f6">(Same State / UT ke andar sale, e.g., Mumbai to Pune)</text>

    <rect x="25" y="80" width="145" height="95" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="97" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">CGST</text>
    <text x="97" y="128" text-anchor="middle" font-size="12" fill="#64748b">Central GST</text>
    <text x="97" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">50% Share</text>

    <rect x="190" y="80" width="145" height="95" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="262" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">SGST / UTGST</text>
    <text x="262" y="128" text-anchor="middle" font-size="12" fill="#64748b">State / UT GST</text>
    <text x="262" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">50% Share</text>
  </g>

  <!-- Right: Inter-State Supply -->
  <g transform="translate(480, 220)">
    <rect width="360" height="200" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="180" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#6b21a8">INTER-STATE SUPPLY</text>
    <text x="180" y="55" text-anchor="middle" font-size="13" fill="#9333ea">(Different States ya Import/Export, e.g., Delhi to Mumbai)</text>

    <rect x="30" y="80" width="300" height="95" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="180" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#7e22ce">IGST (Integrated GST)</text>
    <text x="180" y="135" text-anchor="middle" font-size="13" fill="#64748b">Center collect karta hai, fir Destination State ke sath 50:50 share hota hai</text>
    <text x="180" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IGST = CGST Rate + SGST Rate (100% Tax)</text>
  </g>
</svg>