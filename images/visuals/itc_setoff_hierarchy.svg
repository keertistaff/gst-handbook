<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="background:#ffffff; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Rule of ITC Set-Off (Section 49, 49A &amp; 49B)</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#64748b">Input Tax Credit ko Output Liability ke sath adjust karne ka sunehra kanooni niyam</text>

  <!-- Rule Box 1: IGST -->
  <g transform="translate(60, 100)">
    <rect width="780" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="25" y="32" font-size="16" font-weight="800" fill="#1d4ed8">1. IGST Credit (Sabse pehle isko 100% khatam karna zaroori hai!)</text>
    <text x="25" y="60" font-size="13.5" fill="#334155">Order: Pehle <tspan font-weight="700" fill="#1d4ed8">IGST Output</tspan> ➔ Fir bache balance se <tspan font-weight="700" fill="#1d4ed8">CGST ya SGST</tspan> kisi bhi proportion me set-off kar sakte hain.</text>
  </g>

  <!-- Rule Box 2: CGST -->
  <g transform="translate(60, 205)">
    <rect width="780" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="25" y="32" font-size="16" font-weight="800" fill="#15803d">2. CGST Credit (IGST credit khatam hone ke baad hi use hoga)</text>
    <text x="25" y="60" font-size="13.5" fill="#334155">Order: Pehle <tspan font-weight="700" fill="#15803d">CGST Output</tspan> ➔ Fir bache balance se <tspan font-weight="700" fill="#15803d">IGST Output</tspan>. (⚠️ SGST ke against kabhi use nahi ho sakta!)</text>
  </g>

  <!-- Rule Box 3: SGST -->
  <g transform="translate(60, 310)">
    <rect width="780" height="85" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="25" y="32" font-size="16" font-weight="800" fill="#7e22ce">3. SGST / UTGST Credit</text>
    <text x="25" y="60" font-size="13.5" fill="#334155">Order: Pehle <tspan font-weight="700" fill="#7e22ce">SGST Output</tspan> ➔ Fir bache balance se <tspan font-weight="700" fill="#7e22ce">IGST Output</tspan>. (⚠️ CGST ke against kabhi use nahi ho sakta!)</text>
  </g>

  <!-- Footer Caution -->
  <rect x="60" y="405" width="780" height="30" rx="4" fill="#fee2e2"/>
  <text x="450" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">🚫 Golden Rule: CGST Credit aur SGST Credit aapas me cross-utilize KABHI nahi ho sakte!</text>
</svg>